<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName odoo.utrecar.com

    # Permitir renovacion de certificados Lets Encrypt sin restricciones
    <Location "/.well-known/acme-challenge/">
        Require all granted
    </Location>

    # Restriccion de acceso: Solo VPN WireGuard (10.8.0.0/24) y local, excluyendo Aseproda (10.8.0.13)
    <Location "/">
        <RequireAll>
            Require not ip 10.8.0.13
            <RequireAny>
                Require local
                Require ip 10.8.0.0/24
            </RequireAny>
        </RequireAll>
    </Location>

    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # Soporte WebSocket para Odoo 17
    ProxyPass /websocket ws://127.0.0.1:8069/websocket
    ProxyPassReverse /websocket ws://127.0.0.1:8069/websocket

    ProxyPass / http://127.0.0.1:8069/
    ProxyPassReverse / http://127.0.0.1:8069/

    ErrorLog ${APACHE_LOG_DIR}/odoo_error.log
    CustomLog ${APACHE_LOG_DIR}/odoo_access.log combined
SSLCertificateFile /etc/letsencrypt/live/odoo.utrecar.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/odoo.utrecar.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
