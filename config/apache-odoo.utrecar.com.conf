<VirtualHost *:80>
    ServerName odoo.utrecar.com

    # Permitir renovacion de certificados Lets Encrypt sin restricciones
    <Location "/.well-known/acme-challenge/">
        Require all granted
    </Location>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =odoo.utrecar.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/odoo_error.log
    CustomLog ${APACHE_LOG_DIR}/odoo_access.log combined
</VirtualHost>
