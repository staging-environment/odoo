<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bg50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="arch50" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="holo50" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <rect width="200" height="130" rx="3" fill="url(#bg50)" stroke="#9a3412" stroke-width="1.5"/>

  <!-- Renaissance Arch (50€) -->
  <path d="M 58 115 L 58 48 C 58 20 142 20 142 48 L 142 115 Z" fill="none" stroke="url(#arch50)" stroke-width="6" opacity="0.35"/>
  <rect x="50" y="45" width="100" height="6" fill="#431407" opacity="0.4"/>

  <!-- European Flag -->
  <rect x="12" y="12" width="30" height="20" fill="#003399" rx="1"/>
  <circle cx="27" cy="22" r="6" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="1.5 2"/>

  <!-- Hologram Stripe -->
  <rect x="168" y="0" width="22" height="130" fill="url(#holo50)" opacity="0.75" stroke="#fdba74" stroke-width="0.5"/>
  <text x="179" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#9a3412" text-anchor="middle" transform="rotate(-90 179 70)">EURO 50</text>

  <!-- Large Bold '50' Value -->
  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#431407" letter-spacing="-4">50</text>
  <text x="78" y="90" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#fff7ed" letter-spacing="-4">50</text>

  <text x="14" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#431407">50</text>
  <text x="14" y="44" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" fill="#7c2d12">EURO / ΕΥΡΩ</text>
</svg>