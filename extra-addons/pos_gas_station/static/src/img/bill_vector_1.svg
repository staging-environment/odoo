<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="100%" height="100%">
  <defs>
    <!-- Gold Outer Ring Gradient -->
    <radialGradient id="goldRim" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <!-- Silver Inner Core Gradient -->
    <radialGradient id="silverCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <filter id="coinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="200" height="130" fill="#ffffff"/>

  <!-- Outer Golden Bezel -->
  <circle cx="100" cy="65" r="58" fill="url(#goldRim)" filter="url(#coinShadow)" stroke="#854d0e" stroke-width="1.5"/>
  <circle cx="100" cy="65" r="56" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Inner Silver Center -->
  <circle cx="100" cy="65" r="41" fill="url(#silverCore)" stroke="#64748b" stroke-width="1"/>

  <!-- Map Silhouette & Lines -->
  <path d="M 94 40 L 94 90 M 106 40 L 106 90 M 82 48 L 118 48 M 82 82 L 118 82" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>

  <!-- Big '1' Number with Bevel -->
  <text x="82" y="82" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#334155" letter-spacing="-2">1</text>
  <text x="80" y="80" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-2">1</text>

  <!-- 'EURO' Text -->
  <text x="110" y="62" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#1e293b" letter-spacing="1">EURO</text>

  <!-- 12 Stars on Golden Rim -->
  <g fill="#ca8a04" opacity="0.9">
    <circle cx="100" cy="12" r="2.5"/><circle cx="100" cy="118" r="2.5"/>
    <circle cx="47" cy="65" r="2.5"/><circle cx="153" cy="65" r="2.5"/>
    <circle cx="63" cy="28" r="2.5"/><circle cx="137" cy="28" r="2.5"/>
    <circle cx="63" cy="102" r="2.5"/><circle cx="137" cy="102" r="2.5"/>
    <circle cx="47" cy="45" r="2.5"/><circle cx="153" cy="45" r="2.5"/>
    <circle cx="47" cy="85" r="2.5"/><circle cx="153" cy="85" r="2.5"/>
  </g>
</svg>