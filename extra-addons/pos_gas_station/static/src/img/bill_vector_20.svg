<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="arch20" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="holo20" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <rect width="200" height="130" rx="3" fill="url(#bg20)" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Gothic Pointed Windows (20€) -->
  <path d="M 60 115 L 60 55 C 60 30 100 15 100 15 C 100 15 140 30 140 55 L 140 115 Z" fill="none" stroke="url(#arch20)" stroke-width="5" opacity="0.35"/>
  <path d="M 75 115 L 75 62 C 75 42 100 32 100 32 C 100 32 125 42 125 62 L 125 115 Z" fill="none" stroke="url(#arch20)" stroke-width="3" opacity="0.4"/>

  <!-- European Flag -->
  <rect x="12" y="12" width="30" height="20" fill="#003399" rx="1"/>
  <circle cx="27" cy="22" r="6" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="1.5 2"/>

  <!-- Hologram Stripe -->
  <rect x="168" y="0" width="22" height="130" fill="url(#holo20)" opacity="0.75" stroke="#7dd3fc" stroke-width="0.5"/>
  <text x="179" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#0369a1" text-anchor="middle" transform="rotate(-90 179 70)">EURO 20</text>

  <!-- Large Bold '20' Value -->
  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#082f49" letter-spacing="-4">20</text>
  <text x="78" y="90" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#f0f9ff" letter-spacing="-4">20</text>

  <text x="14" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#082f49">20</text>
  <text x="14" y="44" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" fill="#075985">EURO / ΕΥΡΩ</text>
</svg>