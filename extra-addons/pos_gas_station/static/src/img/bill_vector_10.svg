<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="35%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="arch10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="holo10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
  </defs>

  <rect width="200" height="130" rx="3" fill="url(#bg10)" stroke="#991b1b" stroke-width="1.5"/>

  <!-- Romanesque Arch (10€) -->
  <path d="M 60 115 L 60 50 C 60 22 140 22 140 50 L 140 115 Z" fill="none" stroke="url(#arch10)" stroke-width="6" opacity="0.35"/>
  <path d="M 75 115 L 75 60 C 75 42 125 42 125 60 L 125 115 Z" fill="none" stroke="url(#arch10)" stroke-width="3.5" opacity="0.4"/>

  <!-- European Flag -->
  <rect x="12" y="12" width="30" height="20" fill="#003399" rx="1"/>
  <circle cx="27" cy="22" r="6" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="1.5 2"/>

  <!-- Hologram Stripe -->
  <rect x="168" y="0" width="22" height="130" fill="url(#holo10)" opacity="0.75" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="179" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#991b1b" text-anchor="middle" transform="rotate(-90 179 70)">EURO 10</text>

  <!-- Large Bold '10' Value -->
  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#450a0a" letter-spacing="-4">10</text>
  <text x="78" y="90" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#fff1f2" letter-spacing="-4">10</text>

  <text x="14" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#450a0a">10</text>
  <text x="14" y="44" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" fill="#7f1d1d">EURO / ΕΥΡΩ</text>
</svg>