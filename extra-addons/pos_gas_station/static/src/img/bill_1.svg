<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85">
  <defs>
    <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="140" height="85" rx="6" fill="#0f172a"/>
  <!-- Coin Body -->
  <circle cx="70" cy="42.5" r="36" fill="url(#outerRing)" filter="url(#shadow)"/>
  <circle cx="70" cy="42.5" r="26" fill="url(#innerCore)"/>
  <!-- Stars on outer ring -->
  <g fill="#ffffff" opacity="0.8" font-size="6">
    <text x="68" y="14">★</text>
    <text x="68" y="76">★</text>
    <text x="38" y="45">★</text>
    <text x="98" y="45">★</text>
  </g>
  <!-- 1 Euro text -->
  <text x="56" y="52" font-family="-apple-system, Arial, sans-serif" font-weight="900" font-size="28" fill="#1e293b">1</text>
  <text x="73" y="48" font-family="-apple-system, Arial, sans-serif" font-weight="900" font-size="16" fill="#1e3a8a">€</text>
  <text x="73" y="58" font-family="-apple-system, Arial, sans-serif" font-weight="800" font-size="7" fill="#64748b" letter-spacing="1">EURO</text>
</svg>