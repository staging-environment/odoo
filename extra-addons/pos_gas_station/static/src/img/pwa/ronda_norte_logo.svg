<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Clip path to keep everything within the main ellipse -->
    <clipPath id="ellipse-clip">
      <ellipse cx="300" cy="200" rx="275" ry="175" />
    </clipPath>
    
    <!-- Linear gradient for the blue areas to give it a modern, premium look -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="50%" stop-color="#0035ad" />
      <stop offset="100%" stop-color="#001c58" />
    </linearGradient>
  </defs>

  <!-- Outer Shadow / Glow (Optional backplate) -->
  <ellipse cx="300" cy="204" rx="282" ry="182" fill="#000000" opacity="0.15" />

  <!-- Outer White Frame / Border -->
  <ellipse cx="300" cy="200" rx="280" ry="180" fill="#ffffff" stroke="#0035ad" stroke-width="4" />

  <!-- Main Content Area (Clipped to the inner oval boundary) -->
  <g clip-path="url(#ellipse-clip)">
    <!-- White Background Face -->
    <rect width="600" height="400" fill="#ffffff" />

    <!-- Left Blue Blob (Meroil Wing) -->
    <path d="M 215,20 C 275,100 275,300 215,380 L -10,380 L -10,20 Z" fill="url(#blue-grad)" />

    <!-- Right Blue Blob (Meroil Wing) -->
    <path d="M 385,20 C 325,100 325,300 385,380 L 610,380 L 610,20 Z" fill="url(#blue-grad)" />

    <!-- Bottom Blue Segment (For Gas Station Name) -->
    <path d="M -10,290 C 150,245 450,245 610,290 L 610,410 L -10,410 Z" fill="url(#blue-grad)" stroke="#ffffff" stroke-width="3" />

  </g>
</svg>
