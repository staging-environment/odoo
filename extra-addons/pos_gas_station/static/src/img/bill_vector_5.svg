<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="arch5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="holo5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Bill Background -->
  <rect width="200" height="130" rx="3" fill="url(#bg5)" stroke="#475569" stroke-width="1.5"/>

  <!-- Classical Architectural Arch (Classical Period 5€) -->
  <path d="M 65 115 L 65 55 C 65 30 135 30 135 55 L 135 115 Z" fill="none" stroke="url(#arch5)" stroke-width="5" opacity="0.35"/>
  <path d="M 80 115 L 80 65 C 80 48 120 48 120 65 L 120 115 Z" fill="none" stroke="url(#arch5)" stroke-width="3" opacity="0.4"/>
  <rect x="58" y="112" width="84" height="4" fill="#334155" opacity="0.5"/>

  <!-- European Flag -->
  <rect x="12" y="12" width="30" height="20" fill="#003399" rx="1"/>
  <circle cx="27" cy="22" r="6" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="1.5 2"/>

  <!-- Holographic Stripe on right -->
  <rect x="168" y="0" width="22" height="130" fill="url(#holo5)" opacity="0.75" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="179" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle" transform="rotate(-90 179 70)">EURO 5</text>

  <!-- Large Bold '5' Value -->
  <text x="105" y="92" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#1e293b" letter-spacing="-3">5</text>
  <text x="103" y="90" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#f8fafc" letter-spacing="-3">5</text>

  <!-- Small corner numbers -->
  <text x="14" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#1e293b">5</text>
  <text x="14" y="44" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="900" fill="#475569">EURO / ΕΥΡΩ</text>
</svg>