<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="holoGrad_50" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fdba74" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid_50" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.7"/>
    </pattern>
  </defs>
  
  <!-- Banknote Base -->
  <rect width="200" height="120" rx="8" fill="url(#bgGrad_50)" stroke="#c2410c" stroke-width="2"/>
  <rect width="200" height="120" rx="8" fill="url(#grid_50)"/>
  
  <!-- Micro Border -->
  <rect x="6" y="6" width="188" height="108" rx="5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  
  <!-- European Union Flag -->
  <rect x="12" y="12" width="26" height="18" rx="2" fill="#003399" stroke="#002266" stroke-width="0.5"/>
  <text x="25" y="24" font-size="10" fill="#ffd700" text-anchor="middle">★</text>
  
  <!-- Security Hologram Strip -->
  <rect x="162" y="6" width="28" height="108" rx="3" fill="url(#holoGrad_50)" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/>
  <text x="176" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#7c2d12" text-anchor="middle">50</text>
  <text x="176" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#7c2d12" text-anchor="middle">€</text>
  <text x="176" y="62" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="rgba(0,0,0,0.5)" text-anchor="middle">EURO</text>
  <text x="176" y="73" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="rgba(0,0,0,0.4)" text-anchor="middle">ΕΥΡΩ</text>
  <text x="176" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#7c2d12" text-anchor="middle">50</text>
  
  <!-- Central Big Value -->
  <text x="75" y="76" font-family="Arial Black, Impact, sans-serif" font-size="46" font-weight="900" fill="#7c2d12" text-anchor="middle" letter-spacing="-1">50</text>
  <text x="105" y="52" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#7c2d12">€</text>
  
  <!-- Micro BCE ECB text -->
  <text x="12" y="104" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="rgba(255,255,255,0.8)">BCE ECB EЦБ EZB EKP EKT</text>
  <text x="12" y="112" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="rgba(255,255,255,0.7)">EURO / ΕΥΡΩ</text>
</svg>